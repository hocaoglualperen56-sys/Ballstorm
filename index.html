<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ballstorm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101722;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:#101722}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:10px 17px;background:#182331;border-bottom:1px solid #334151}h1{font-size:22px;letter-spacing:1px;margin:0;color:#f5f8fc}small{font-size:11px;color:#a9b7c8;display:block;margin-bottom:4px}.metric{text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}#arena{position:relative;flex:1;min-height:0;background:#111a25}canvas{width:100%;height:100%;display:block;touch-action:none}.bottom{height:66px;background:#182331;display:flex;align-items:center;justify-content:space-around;border-top:1px solid #334151;color:#aab8c8;font-size:12px}.bottom b{color:#fff;font-size:14px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#101722df;z-index:4;padding:22px}.overlay.hide{display:none}.panel{width:100%;max-width:320px;text-align:center;padding:25px 20px;background:#202d3d;border:1px solid #425266;border-radius:15px}.panel h2{margin:0 0 10px;font-size:28px}.panel p{color:#c0cbd8;line-height:1.5;font-size:14px}button{background:#f3f6fa;color:#17202b;border:0;border-radius:8px;font-weight:800;padding:14px 20px;font-size:15px;width:100%;margin-top:8px}#message{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#26394b;padding:8px 14px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
</style></head><body><div id="app">
<header><div><h1>BALLSTORM</h1><small>BRICK BREAKER</small></div><div class="metric"><small>SEVİYE</small><span id="level">1</span></div><div class="metric"><small>PUAN</small><span id="score">0</span></div><div class="metric"><small>TOP</small><span id="count">1</span></div></header>
<div id="arena"><canvas id="game"></canvas><div id="message"></div>
<div id="start" class="overlay"><div class="panel"><h2>BALLSTORM</h2><p>Numaralı blokları kır. Toplarını çoğalt, doğru açıyla nişan al ve mümkün olduğunca uzun süre dayan.</p><button id="play">OYNA</button></div></div>
<div id="over" class="overlay hide"><div class="panel"><h2>OYUN BİTTİ</h2><p>Toplam puanın: <b id="final">0</b></p><button id="again">TEKRAR DENE</button></div></div>
</div><div class="bottom"><div>◉ <b>Topları fırlat</b></div><div>↗ <b>Nişan al</b></div><div>● <b>Top topla</b></div></div></div>
<script>
(()=>{
const cv=document.querySelector('#game'),cx=cv.getContext('2d'),$=id=>document.getElementById(id);
let w=360,h=600,dpr=1,level=1,score=0,ballCount=1,blocks=[],balls=[],pickups=[],particles=[],playing=false,aiming=false,aim={x:180,y:400},origin={x:180,y:560},busy=false,returnX=180,shake=0;
const colors=['#f4b942','#48b7ed','#e96d79','#58c88b','#ad87e8','#f18c48'];
const rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){let r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;cv.width=w*dpr;cv.height=h*dpr;cx.setTransform(dpr,0,0,dpr,0,0);origin={x:returnX,y:h-24};if(!playing)draw()}
new ResizeObserver(resize).observe(cv);
function hud(){$('level').textContent=level;$('score').textContent=score;$('count').textContent=ballCount}
function msg(t){$('message').textContent=t;$('message').style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>$('message').style.opacity=0,1200)}
function roundStart(){level=1;score=0;ballCount=1;blocks=[];balls=[];pickups=[];particles=[];returnX=w/2;origin={x:returnX,y:h-24};playing=true;busy=false;$('start').classList.add('hide');$('over').classList.add('hide');makeRow(true);hud()}
function makeRow(first=false){
 const cols=Math.max(5,Math.min(8,Math.floor(w/46))),gap=5,pad=9,bw=(w-pad*2-gap*(cols-1))/cols,bh=Math.min(38,bw*.76);
 const patterns=[[0,2,4,6],[1,2,3,4,5],[0,1,cols-2,cols-1],[0,2,3,5],[1,3,5],[0,1,2,cols-3,cols-2,cols-1]];
 let pattern=patterns[(level-1)%patterns.length];
 for(let c=0;c<cols;c++){if(!first&&Math.random()<.17)continue;if(!first&&!pattern.includes(c)&&Math.random()<.8)continue;
 const hp=first?1:Math.max(1,Math.floor(rnd(1,level*1.1+2)));
 blocks.push({x:pad+c*(bw+gap),y:18,w:bw,h:bh,hp,max:hp,color:Math.floor(rnd(0,colors.length)),pickup:Math.random()<.13?'ball':(Math.random()<.07?'bomb':'')});
 }
 if(first&&blocks.length===0)makeRow(true);
}
function end(){playing=false;busy=false;$('final').textContent=score;$('over').classList.remove('hide')}
function burst(x,y,color,n=6){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-2.6,2.6),vy:rnd(-3,2),life:28,color})}
function circleHit(b,x,y,r){let nx=Math.max(b.x,Math.min(x,b.x+b.w)),ny=Math.max(b.y,Math.min(y,b.y+b.h));return (x-nx)**2+(y-ny)**2<r*r}
function fire(){if(!playing||busy||!aiming)return;let dx=aim.x-origin.x,dy=aim.y-origin.y,len=Math.hypot(dx,dy);if(len<20||dy> -12){aiming=false;return}dx/=len;dy/=len;busy=true;aiming=false;for(let i=0;i<ballCount;i++)balls.push({x:origin.x,y:origin.y,vx:dx*5.1,vy:dy*5.1,delay:i*3,r:4.3});}
function step(){
 if(playing){
  if(shake>0)shake--;
  for(let i=balls.length-1;i>=0;i--){let b=balls[i];if(b.delay){b.delay--;continue}b.x+=b.vx;b.y+=b.vy;
   if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>w-b.r){b.x=w-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
   if(b.y>=origin.y){returnX=returnX===w/2?b.x:(returnX*.65+b.x*.35);balls.splice(i,1);continue}
   for(let j=blocks.length-1;j>=0;j--){let q=blocks[j];if(circleHit(q,b.x,b.y,b.r)){let px=b.x-b.vx,py=b.y-b.vy;if(px<q.x||px>q.x+q.w)b.vx*=-1;else b.vy*=-1;q.hp--;score++;shake=1;burst(b.x,b.y,colors[q.color],2);if(q.hp<=0){score+=q.max*2;burst(q.x+q.w/2,q.y+q.h/2,colors[q.color],9);if(q.pickup)pickups.push({x:q.x+q.w/2,y:q.y+q.h/2,type:q.pickup});blocks.splice(j,1)}break}}
  }
  for(let i=pickups.length-1;i>=0;i--){let p=pickups[i];p.y+=1.4;if(p.y>origin.y-4){if(p.type==='ball'){ballCount++;msg('+1 TOP!')}else{blocks.forEach(q=>q.hp=Math.max(0,q.hp-2));blocks=blocks.filter(q=>q.hp>0);score+=8;msg('PATLAMA!')}pickups.splice(i,1);hud()}else if(p.y>h)pickups.splice(i,1)}
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.life--});particles=particles.filter(p=>p.life>0);
  if(busy&&balls.length===0){busy=false;origin={x:Math.max(12,Math.min(w-12,returnX)),y:h-24};if(blocks.length===0){level++;makeRow();msg('SEVİYE '+level)}else{blocks.forEach(q=>q.y+=q.h+5);if(blocks.some(q=>q.y+q.h>=origin.y-9)){end()}else{makeRow();if(blocks.some(q=>q.y+q.h>=origin.y-9))end()}}hud()}
 }
 draw();requestAnimationFrame(step)
}
function roundRect(x,y,w,h,r){cx.beginPath();cx.roundRect(x,y,w,h,r)}
function draw(){cx.clearRect(0,0,w,h);cx.fillStyle='#111a25';cx.fillRect(0,0,w,h);
 // quiet guide grid
 cx.strokeStyle='#ffffff08';cx.lineWidth=1;for(let y=0;y<h;y+=28){cx.beginPath();cx.moveTo(0,y);cx.lineTo(w,y);cx.stroke()}
 cx.save();if(shake)cx.translate(rnd(-shake,shake),rnd(-shake,shake));
 blocks.forEach(q=>{let col=colors[q.color];cx.fillStyle=col;roundRect(q.x,q.y,q.w,q.h,5);cx.fill();cx.fillStyle='#17212d';cx.font='bold '+Math.min(18,q.h*.52)+'px Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(q.hp,q.x+q.w/2,q.y+q.h/2+1);if(q.pickup==='ball'){cx.fillStyle='#fff';cx.beginPath();cx.arc(q.x+q.w-5,q.y+5,3,0,Math.PI*2);cx.fill()}});
 pickups.forEach(p=>{cx.fillStyle=p.type==='ball'?'#fff':'#ff634e';cx.beginPath();cx.arc(p.x,p.y,7,0,Math.PI*2);cx.fill();cx.fillStyle='#14202c';cx.font='bold 10px Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.type==='ball'?'+':'✹',p.x,p.y)});
 particles.forEach(p=>{cx.globalAlpha=p.life/28;cx.fillStyle=p.color;cx.fillRect(p.x,p.y,3,3)});cx.globalAlpha=1;
 balls.forEach(b=>{cx.fillStyle='#f7fbff';cx.shadowColor='#fff';cx.shadowBlur=5;cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();cx.shadowBlur=0});
 origin={x:Math.max(12,Math.min(w-12,origin.x)),y:h-24};
 if(aiming&&playing&&!busy){let dx=aim.x-origin.x,dy=aim.y-origin.y,l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;if(dy>-.12)dy=-.12;cx.setLineDash([4,5]);cx.strokeStyle='#ffffff99';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(origin.x,origin.y);cx.lineTo(origin.x+dx*150,origin.y+dy*150);cx.stroke();cx.setLineDash([])}
 cx.fillStyle='#fff';cx.beginPath();cx.arc(origin.x,origin.y,5,0,Math.PI*2);cx.fill();cx.restore()}
function pos(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{if(!playing||busy)return;let p=pos(e);aiming=true;aim=p;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(aiming){aim=pos(e);aim.y=Math.min(aim.y,origin.y-15)}});
cv.addEventListener('pointerup',e=>{if(aiming){aim=pos(e);aim.y=Math.min(aim.y,origin.y-15);fire()}});
cv.addEventListener('pointercancel',()=>aiming=false);
$('play').onclick=roundStart;$('again').onclick=roundStart;hud();resize();requestAnimationFrame(step);
})();
</script></body></html>
